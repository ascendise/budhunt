[package]
name = "ace-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ace = { version = "0.1.0", path = "../ace" }
clap = { version = "4.6.1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = [] }
pretty_assertions = "1.4.1"
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
ace = { version = "0.1.0", path = "../ace", features = ["test_utils"] }
test-case = "3.3.1"
